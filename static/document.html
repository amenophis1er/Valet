<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Valet — document</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    @page { margin: 20mm 18mm; }
    html, body { margin: 0; background: #fff; color: #17191c; }
    body { font: 11pt/1.5 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    main { max-width: 720px; margin: 0 auto; padding: 32px 24px 48px; }
    @media print { main { max-width: none; margin: 0; padding: 0; } }
    h1, h2, h3 { line-height: 1.25; margin: 1.4em 0 .5em; break-after: avoid; }
    h1 { font-size: 22pt; margin-top: 0; } h2 { font-size: 16pt; } h3 { font-size: 13pt; }
    p { margin: 0 0 .8em; } ul, ol { margin: 0 0 .8em; padding-left: 1.6em; } li { margin: .15em 0; }
    blockquote { margin: 0 0 .8em; padding: .2em 0 .2em 1em; border-left: 3px solid #D3C7F7; color: #40474c; }
    hr { border: 0; border-top: 1px solid #dde3e4; margin: 1.2em 0; }
    code { font: 9.5pt/1.4 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; background: #f3f5f6; padding: .1em .3em; border-radius: 4px; }
    pre { background: #f3f5f6; border: 1px solid #e3e8ea; border-radius: 6px; padding: 10px 12px; margin: 0 0 .9em; white-space: pre-wrap; overflow-wrap: anywhere; break-inside: avoid; }
    pre code { background: none; padding: 0; }
    table { border-collapse: collapse; margin: 0 0 1em; width: 100%; font-size: 10pt; }
    th, td { border: 1px solid #d4dadc; padding: 5px 8px; text-align: left; vertical-align: top; }
    th { background: #f3f5f6; } tr { break-inside: avoid; }
    a { color: #5A3BC9; }
    #gone { color: #5d6368; font-style: italic; }
  </style>
</head>
<body>
  <main id="document"><p id="gone" hidden>This document is no longer kept.</p></main>
  <script type="module" src="document.js"></script>
</body>
</html>
