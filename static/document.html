<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Valet — document</title>
  <style>
    /* A document Valet made, laid out for Chrome to print (pdf.ts). Valet's violet, on paper. */
    :root {
      color-scheme: light;
      --ink: #1B1924;
      --muted: #5D5970;
      --faint: #8F8AA0;
      --line: #E3E0EB;
      --accent: #6544D6;
      --accent-text: #5A3BC9;
      --accent-soft: #F3F0FD;
      --accent-line: #D3C7F7;
      --sunk: #F6F5F9;
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, "Helvetica Neue", Arial, sans-serif;
      --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
    }
    * { box-sizing: border-box; }
    /* The bottom margin holds Chrome's footer: the title and the page number. */
    @page { margin: 18mm 18mm 20mm; }
    html, body { margin: 0; background: #fff; color: var(--ink); }
    body { font: 10.5pt/1.6 var(--font); -webkit-print-color-adjust: exact; print-color-adjust: exact; font-feature-settings: "kern", "liga"; }
    main { max-width: 760px; margin: 0 auto; padding: 40px 28px 56px; }
    @media print { main { max-width: none; margin: 0; padding: 0; } }

    /* The title block */
    .title-block { margin: 0 0 26pt; padding-bottom: 14pt; border-bottom: 1px solid var(--line); position: relative; }
    .title-block::after { content: ""; position: absolute; left: 0; bottom: -2px; width: 56pt; height: 3px; border-radius: 2px; background: linear-gradient(90deg, var(--accent), #9A7BFF); }
    .eyebrow { margin: 0 0 8pt; font-size: 8.5pt; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--accent-text); }
    .title-block h1 { margin: 0; font-size: 26pt; line-height: 1.15; font-weight: 700; letter-spacing: -.015em; text-wrap: balance; }
    .subtitle { margin: 8pt 0 0; font-size: 13pt; line-height: 1.4; color: var(--muted); text-wrap: balance; }

    /* The body */
    article > :first-child { margin-top: 0; }
    h2, h3 { break-after: avoid; text-wrap: balance; }
    h2 { margin: 22pt 0 7pt; font-size: 14.5pt; line-height: 1.3; font-weight: 650; letter-spacing: -.005em; }
    h3 { margin: 16pt 0 5pt; font-size: 11.5pt; line-height: 1.35; font-weight: 650; color: var(--accent-text); }
    p { margin: 0 0 8pt; orphans: 3; widows: 3; }
    ul, ol { margin: 0 0 9pt; padding-left: 1.5em; }
    li { margin: 3pt 0; padding-left: .15em; }
    li::marker { color: var(--accent); }
    ol > li::marker { font-weight: 600; font-variant-numeric: tabular-nums; }
    strong { font-weight: 650; }
    a { color: var(--accent-text); text-decoration-color: var(--accent-line); text-underline-offset: 2px; }
    hr { border: 0; border-top: 1px solid var(--line); margin: 16pt 0; }

    /* A quote is a callout */
    blockquote { margin: 4pt 0 11pt; padding: 9pt 12pt; border-left: 3px solid var(--accent); border-radius: 0 6px 6px 0; background: var(--accent-soft); color: #2E2A3D; break-inside: avoid; }

    /* Code */
    code { font: 9pt/1.45 var(--mono); background: var(--sunk); padding: .1em .35em; border-radius: 4px; }
    pre { margin: 0 0 10pt; padding: 10pt 12pt; background: var(--sunk); border: 1px solid var(--line); border-radius: 6px; white-space: pre-wrap; overflow-wrap: anywhere; break-inside: avoid; }
    pre code { background: none; padding: 0; }

    /* Tables */
    .table-wrap { margin: 4pt 0 12pt; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
    table { border-collapse: collapse; width: 100%; font-size: 9.5pt; line-height: 1.45; font-variant-numeric: tabular-nums; }
    th, td { padding: 6pt 9pt; text-align: left; vertical-align: top; }
    th { background: var(--accent-soft); color: #2E2A3D; font-weight: 650; border-bottom: 1px solid var(--accent-line); }
    tbody tr:nth-child(even) td { background: #FAFAFC; }
    tbody tr + tr td { border-top: 1px solid var(--line); }
    tr { break-inside: avoid; }
    thead { display: table-header-group; }

    /* Sources */
    .sources { margin-top: 24pt; padding-top: 12pt; border-top: 1px solid var(--line); }
    .sources h2 { break-after: avoid; margin: 0 0 6pt; font-size: 9pt; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
    .sources ol { margin: 0; padding-left: 1.4em; font-size: 9pt; line-height: 1.5; color: var(--muted); }
    .sources li { margin: 2pt 0; }
    .sources a { overflow-wrap: anywhere; }

    #gone { color: var(--muted); font-style: italic; }
  </style>
</head>
<body>
  <main id="document"><p id="gone" hidden>This document is no longer kept.</p></main>
  <script type="module" src="document.js"></script>
</body>
</html>
