<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Errand — image</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: #111314; color: #e8eaed; font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
    body { display: flex; flex-direction: column; }
    header { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-bottom: 1px solid #2d3134; }
    #name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #9aa0a6; }
    button { font: inherit; padding: 6px 14px; border-radius: 10px; border: 1px solid #2dd4bf; background: #2dd4bf; color: #062a26; font-weight: 600; cursor: pointer; }
    main { flex: 1; min-height: 0; display: grid; place-items: center; padding: 12px; overflow: auto; }
    main.actual { place-items: start; }
    img { max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 6px; cursor: zoom-in; }
    main.actual img { max-width: none; max-height: none; cursor: zoom-out; }
    #gone { color: #9aa0a6; }
  </style>
</head>
<body>
  <header><span id="name"></span><button id="download" hidden>Download</button></header>
  <main id="stage"><p id="gone" hidden>This image is no longer kept.</p><img id="image" alt="" hidden></main>
  <script type="module" src="viewer.js"></script>
</body>
</html>
